<!DOCTYPE html> 
<html lang="sv"> 
<head> 
    <meta charset="UTF-8"> 
    <title> Filmkväll</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    
    <h1>Filmkväll</h1> 
        <input id="movieInput" placeholder="Skriv en film"> 
        
            <button id="addMovieButton"> Lägg till film
            </button> 

            
            <!-- <ul id="movieList"> 
            </ul>  -->

            <table id="movieTable">
                <thead>
                    <tr>
                        <th>Titel</th>
                        <th>Röster</th>
                        <th>Sett</th>
                        <th>Radera</th>
                    </tr>
                </thead>
                <tbody id="movieList">
                </tbody>
            </table>

            <button id="randomButton"> 
            Slumpa film 
            </button> 
            
            <button id="favoriteButton">
                Visa favoritfilm
            </button>
            <div id="favoriteResult"></div> 

            <button id="showAllMovies">
                Visa alla filmer
            </button>
     
    <script src="script.js"></script> 
</body> 
</html>
